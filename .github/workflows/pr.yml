# PR pipeline (blocking).  (ADR-0037)
#
# Nearly every other ADR names a CI check as its enforcement mechanism. Without
# this file, those enforcement claims have no implementation.
#
# STAGED ACTIVATION. Stages whose subject does not exist yet are declared here as
# skipped, each citing its ADR. The rule, and it is not negotiable:
#
#     THE PR THAT LANDS A SUBJECT ACTIVATES ITS STAGE.
#
# No stage may sit green against a nonexistent target. A check that passes because
# it matched nothing is indistinguishable from a check that passes because the code
# is correct — that is the silent-hole class that produced C1, and it is the same
# failure as an ESLint rule scoped to a directory that does not exist.

name: PR

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Gates that need no node_modules. These are live and green today.
  # ---------------------------------------------------------------------------
  standalone-gates:
    name: Standalone gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans full history; a secret in an old commit still needs rotating

      - name: Agent hook self-test (ADR-0038)
        run: sh tools/block-prototype-writes.test.sh

      - name: Mining gate (ADR-0003)
        run: sh tools/check-mining-docs.sh origin/${{ github.base_ref }}

      - name: C-number coverage (ADR-0003)
        run: sh tools/check-cnumber-coverage.sh

      # Guards against an enforcement clause naming a path that nothing will
      # create — a gate that reports green forever. Report-only until the last
      # W7 subject lands, then switch to --strict.
      - name: Path audit (ADR-0019/0047 near-miss)
        run: node tools/path-audit.mjs

      # ACTIVATED 2026-08-08 by the PR that added docs/glossary.md.
      # Live-fired before being trusted: verified it passes a clean tree and rejects
      # PipelineEntry, ServiceCategory and isLeadPricer.
      - name: Glossary lint (ADR-0048, C13)
        run: node tools/check-glossary.mjs

      # ACTIVATED 2026-08-08 by the PR that added the first module with a domain/.
      # Caught a real gap on its first run: the health module had no tier declaration.
      - name: Module tiers (ADR-0007)
        run: node tools/check-module-tiers.mjs

      # ACTIVATED 2026-08-09 with ADR-0051's denylist. Each denied package would
      # silently reverse a ratified decision; installing one is a supersession, and
      # this is what makes it a reviewed decision rather than an install nobody saw.
      - name: Dependency denylist (ADR-0012, 0051, 0011, 0005, 0050)
        run: node tools/check-dependency-denylist.mjs

      - name: Secret scan (ADR-0035)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ACTIVATED 2026-08-08 by the PR that added CLAUDE.md, per the staged-activation
      # rule. ADR-0038 caps the root file at 200 lines: an auto-generated or bloated
      # context file measurably reduced task success in five of eight settings in the
      # cited study, so the limit is a real constraint, not tidiness.
      - name: CLAUDE.md length check (ADR-0038)
        run: |
          lines=$(wc -l < CLAUDE.md)
          echo "CLAUDE.md is $lines lines (limit 200)"
          [ "$lines" -le 200 ] || { echo "::error::CLAUDE.md is $lines lines, limit is 200"; exit 1; }

      - name: Agent hooks are wired (ADR-0038)
        run: |
          # The hook script existing is not the same as the hook running. Until
          # .claude/settings.json referenced it, the prototype freeze was
          # discipline-only — the state ADR-0038 argues is insufficient.
          node -e '
            const s = require("./.claude/settings.json");
            const pre = (s.hooks && s.hooks.PreToolUse) || [];
            const wired = JSON.stringify(pre).includes("block-prototype-writes.sh");
            if (!wired) { console.error("::error::PreToolUse is not wired to tools/block-prototype-writes.sh (ADR-0002, ADR-0038)"); process.exit(1); }
            console.log("PreToolUse wired to the prototype-freeze hook");
          '

  # ---------------------------------------------------------------------------
  # Gates that need an installed workspace.
  #
  # The lockfile-prerequisite step below is retained now that the lockfile exists:
  # it names the cause if the lockfile is ever removed or a pnpm without catalog
  # support is used, rather than failing several steps later with an unrelated error.
  # ---------------------------------------------------------------------------
  workspace:
    name: Workspace checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lockfile prerequisite
        run: |
          if [ ! -f pnpm-lock.yaml ]; then
            echo "::error::pnpm-lock.yaml is missing. ADR-0001 requires pnpm catalogs," \
                 "which need pnpm >= 9.5. Enable corepack or upgrade pnpm, run" \
                 "'pnpm install', and commit the lockfile. This job is red on purpose" \
                 "rather than skipped, so the gap is visible."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Boundary config self-test (ADR-0008, ADR-0037)
        run: sh tools/dependency-cruiser.test.sh

      - name: Boundaries (ADR-0008)
        run: pnpm check:boundaries

      - name: Typecheck (ADR-0009)
        run: pnpm typecheck

      # SKIPPED — subject does not exist: no eslint config yet.
      # ACTIVATE WITH: the PR that adds the eslint config.
      # Carries the boundaries mirror, role-literal, money-arithmetic and RTL
      # directional-utility rules.  (ADR-0008, ADR-0021, ADR-0016, ADR-0019)
      # - name: Lint
      #   run: pnpm lint

      # SKIPPED — subject does not exist: no OpenAPI contract or generated client.
      # ACTIVATE WITH: the PR that adds packages/contracts.  (ADR-0010)
      # - name: Contract codegen drift
      #   run: pnpm codegen && git diff --exit-code
      # - name: OpenAPI breaking-change diff vs main
      #   run: pnpm openapi:diff

      # ACTIVATED 2026-08-09. The lint itself is live now, with its self-test, even
      # though no migration exists yet: ADR-0014's rider requires it be verified BEFORE
      # it is relied upon, and the self-test's fixtures are generated by the real
      # drizzle-kit pipeline rather than hand-written.
      - name: Migration lint self-test (ADR-0014 rider)
        run: node tools/migration-lint.test.mjs

      - name: Migration lint (ADR-0014)
        run: |
          # packages/database does not exist yet; the lint no-ops on an absent directory
          # and says so, rather than passing silently.
          node tools/check-migrations.mjs packages/database/migrations

      # ACTIVATED 2026-08-08 by the PR that scaffolded packages/domain.
      - name: Domain purity (ADR-0006, ADR-0005)
        run: sh tools/check-domain-purity.sh

      - name: API adapter smoke test (ADR-0005, ADR-0010)
        run: pnpm --filter @engipro/api test:adapter

      - name: Web build is self-contained (ADR-0050, ADR-0032)
        run: |
          pnpm --filter @engipro/web build
          node tools/assert-no-cdn.mjs apps/web/dist/index.html

      # ACTIVATED 2026-08-08 by the PR that added the identity domain layer.
      # 27 assertions pass; 6 are skipped and each states which lane it needs.
      - name: Unit + domain tests (ADR-0009, ADR-0029)
        run: pnpm --filter @engipro/api test

      # Integration tests run in their own job below — they need a service container,
      # and attaching one to this job would start a database for every unit run.

      # SKIPPED — subject does not exist: no permission model implemented.
      # ACTIVATE WITH: the PR that implements the resolver.  (ADR-0021, ADR-0049, ADR-0044)
      # Every (role x endpoint x scope), IDOR probes, approval-authority limits,
      # and the ADR-0049 monotonicity property test.
      # - name: Role-matrix suite
      #   run: pnpm test:roles

      # SKIPPED — subject does not exist: no state machines implemented.
      # ACTIVATE WITH: the PR that adds the first transition() call.  (ADR-0029)
      # - name: State-machine suite
      #   run: pnpm test:transitions

      # SKIPPED — subject does not exist: no Dockerfiles.
      # ACTIVATE WITH: the PR that adds infra/docker.  (ADR-0032)
      # Note: arm64, and the built index.html must contain no CDN <script src="http…>
      # and no importmap (ADR-0050).
      # - name: Docker build (linux/arm64, no push)
      #   run: docker buildx build --platform linux/arm64 -f infra/docker/Dockerfile.api .
      # - name: Trivy scan
      #   uses: aquasecurity/trivy-action@master

  # ---------------------------------------------------------------------------
  # Integration lane. (ADR-0009, ADR-0037)
  #
  # The service-container pattern is the one proven by the multi-schema PoC
  # (.github/workflows/poc-multischema.yml), lifted rather than rewritten.
  #
  # The lane's first test asserts the HARNESS: that a real PostgreSQL is connected and
  # that writes do not survive a test. Isolation is the property every later
  # integration test inherits — without it, failures present as flakiness and get
  # "fixed" by reordering tests, which hides the real defect.
  #
  # The runner FAILS when it finds zero test files, and FAILS when DATABASE_URL is
  # absent. Neither is a skip: "integration tests passed" with nothing run is the most
  # misleading green a pipeline can produce (ADR-0048 standing rule).
  # ---------------------------------------------------------------------------
  integration:
    name: Integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: engipro
          POSTGRES_USER: engipro
          POSTGRES_DB: engipro_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U engipro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Integration tests (real PostgreSQL)
        env:
          DATABASE_URL: postgres://engipro:engipro@localhost:5432/engipro_test
        run: pnpm --filter @engipro/api test:integration
