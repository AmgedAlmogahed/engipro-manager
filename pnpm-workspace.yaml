# Workspace definition. See ADR-0001.
#
# apps/prototype is deliberately ABSENT. ADR-0002 freezes it and excludes it
# from the dependency graph; leaving it out of the workspace is the strongest
# mechanical form of that exclusion — it cannot import a workspace package and
# no workspace package can import it, because pnpm does not link it at all.
# It stays runnable on its own npm lockfile.
packages:
  - 'apps/api'
  - 'apps/web'
  - 'packages/*'

# Catalogs pin shared dependency versions in ONE place, so drift between
# packages becomes impossible rather than merely discouraged (ADR-0001).
# Consumers reference these as `"react": "catalog:"`.
#
# Seeded from the versions the prototype already runs, so apps/web starts from
# a known-good set rather than whatever is newest on the day it is scaffolded.
catalog:
  react: ^19.2.3
  react-dom: ^19.2.3
  react-router-dom: ^7.12.0
  typescript: ~5.8.2
  vite: ^6.2.0
  '@vitejs/plugin-react': ^5.0.0
  '@types/node': ^22.14.0

  # API — NestJS on the Fastify adapter (ADR-0005). ADR-0005 warns that the TC39
  # decorator migration is incomplete and to verify @nestjs/swagger compatibility
  # before upgrading, so the @nestjs/* set is kept on one aligned version line.
  '@nestjs/common': 11.1.28
  '@nestjs/core': 11.1.28
  '@nestjs/platform-fastify': 11.1.28
  '@nestjs/swagger': 11.4.6
  '@nestjs/cli': 11.0.24
  reflect-metadata: 0.2.2
  # @nestjs/swagger 11.4.6 declares peer ^8||^9. Pinned inside that range rather
  # than on latest: ADR-0005 warns to verify swagger compatibility before upgrading.
  '@fastify/static': ^9.3.0
  tsx: 4.23.11

  # Frontend (ADR-0050). Tailwind is a BUILD dependency — never a CDN <script>,
  # which is what the frozen prototype does and what the build assertion blocks.
  '@tanstack/react-query': ^5.101.4
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  tailwindcss: ^4.3.3
  '@tailwindcss/vite': ^4.3.3
